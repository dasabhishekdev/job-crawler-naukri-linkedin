# Production stack for the VPS. Built on the server by deploy/deploy.sh (ICDS-style),
# after GitHub Actions rsyncs the reviewed tree via deploy/ci-deploy.sh.
# Public traffic: hosting edge-nginx → job-crawler-web:80 on Docker network `web`.
# Manual:  cd ~/job-crawler && GIT_SHA=manual bash deploy/deploy.sh
name: job-crawler

x-app-env: &app-env
  NODE_ENV: production
  MONGODB_URI: mongodb://${MONGO_ROOT_USER:?}:${MONGO_ROOT_PASSWORD:?}@mongodb:27017/jobportal?authSource=admin
  PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env, e.g. https://job-crawler.educoreva.com}
  SESSION_SECRET: ${SESSION_SECRET:?}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  mongodb:
    image: mongo:7
    container_name: job-crawler-mongodb
    restart: unless-stopped
    logging: *logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    image: job-crawler-api:latest
    container_name: job-crawler-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *app-env
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
    depends_on:
      mongodb: { condition: service_healthy }

  worker:
    image: job-crawler-worker:latest
    container_name: job-crawler-worker
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    logging: *logging
    init: true
    shm_size: "512mb"
    environment:
      <<: *app-env
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-3}
    volumes:
      - worker_data:/app/data
    depends_on:
      mongodb: { condition: service_healthy }

  browser:
    image: job-crawler-browser:latest
    container_name: job-crawler-browser
    build:
      context: .
      dockerfile: apps/browser/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    logging: *logging
    init: true
    shm_size: "1gb"
    environment:
      <<: *app-env
      MAX_LOGIN_SESSIONS: ${MAX_LOGIN_SESSIONS:-3}
    depends_on:
      mongodb: { condition: service_healthy }

  web:
    image: job-crawler-web:latest
    container_name: job-crawler-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESS: ":80"
    expose:
      - "80"
    networks:
      default:
      web:
        aliases: [job-crawler-web]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    depends_on:
      api: { condition: service_healthy }
      browser: { condition: service_healthy }

  backup:
    image: mongo:7
    container_name: job-crawler-backup
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:?}:${MONGO_ROOT_PASSWORD:?}@mongodb:27017/?authSource=admin
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      mongodb: { condition: service_healthy }

networks:
  web:
    external: true
    name: web

volumes:
  mongo_data:
  worker_data:
  caddy_data:
  caddy_config:
