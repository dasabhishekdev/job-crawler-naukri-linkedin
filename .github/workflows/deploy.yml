name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/job-crawler" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: ${{ vars.VPS_PLATFORM || 'linux/amd64' }}
          push: true
          tags: |
            ${{ steps.name.outputs.prefix }}-${{ matrix.app }}:latest
            ${{ steps.name.outputs.prefix }}-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VPS_PATH: ${{ vars.VPS_PATH || '/opt/job-crawler' }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose files to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          source: "docker-compose.prod.yml,deploy/backup.sh"
          target: ${{ env.VPS_PATH }}
          strip_components: 0
      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ env.VPS_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_TAG,DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            cp deploy/backup.sh ./backup.sh && chmod +x ./backup.sh
            mkdir -p backups
            test -f .env || { echo "Missing $DEPLOY_PATH/.env (copy .env.example and fill it in)"; exit 1; }
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose -f docker-compose.prod.yml ps -q api)" || true)
              [ "$status" = "healthy" ] && echo "API healthy" && break
              sleep 5
            done
            [ "$status" = "healthy" ] || { docker compose -f docker-compose.prod.yml logs --tail 80 api; exit 1; }
            docker logout ghcr.io
            docker image prune -f
