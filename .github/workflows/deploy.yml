name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        app: [api, worker, browser, web]
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/job-crawler" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: ${{ vars.VPS_PLATFORM || 'linux/amd64' }}
          push: true
          tags: |
            ${{ steps.name.outputs.prefix }}-${{ matrix.app }}:latest
            ${{ steps.name.outputs.prefix }}-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL || 'https://job-crawler.educoreva.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/job-crawler" >> "$GITHUB_OUTPUT"
      - name: Upload release and restart on the VPS
        run: bash deploy/ship.sh
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ vars.PROD_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_PASSPHRASE: ${{ secrets.PROD_SSH_PASSPHRASE }}
          PROD_SSH_KNOWN_HOSTS: ${{ vars.PROD_SSH_KNOWN_HOSTS }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://job-crawler.educoreva.com' }}
          IMAGE_PREFIX: ${{ steps.name.outputs.prefix }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - name: Public health check
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://job-crawler.educoreva.com' }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$PUBLIC_URL/api/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::warning::$PUBLIC_URL/api/health is not reachable yet. The containers are healthy on the VPS; check DNS / Cloudflare and the hosting route."
