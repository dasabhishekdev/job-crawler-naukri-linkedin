name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
        env:
          MONGODB_URI_TEST: mongodb://localhost:27017/jobcrawler_ci
      - name: Build web
        run: npm run build:web
      - name: Validate compose files
        run: |
          cp .env.example .env
          sed -i 's/^SESSION_SECRET=.*/SESSION_SECRET=ci-only-secret-ci-only-secret-0000/; s/^APP_ENCRYPTION_KEY=.*/APP_ENCRYPTION_KEY=ci/' .env
          docker compose config --quiet
          SITE_ADDRESS=example.com IMAGE_PREFIX=ghcr.io/x/job-crawler MONGO_ROOT_USER=u MONGO_ROOT_PASSWORD=p PUBLIC_URL=https://example.com \
            docker compose -f docker-compose.prod.yml config --quiet
