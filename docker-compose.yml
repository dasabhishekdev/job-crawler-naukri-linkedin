# Local stack built from source. Open http://localhost:3006
# Production uses docker-compose.prod.yml (prebuilt images, MongoDB auth, HTTPS, backups).
name: job-crawler

x-app-env: &app-env
  NODE_ENV: production
  MONGODB_URI: mongodb://mongodb:27017/jobportal
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3006}
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment: *app-env
    depends_on:
      mongodb: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    init: true
    shm_size: "512mb"
    environment:
      <<: *app-env
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-3}
    volumes:
      - worker_data:/app/data
    depends_on:
      mongodb: { condition: service_healthy }

  browser:
    build: { context: ., dockerfile: apps/browser/Dockerfile }
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    environment:
      <<: *app-env
      MAX_LOGIN_SESSIONS: ${MAX_LOGIN_SESSIONS:-3}
    depends_on:
      mongodb: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "${WEB_PORT:-3006}:80"
    depends_on:
      api: { condition: service_healthy }
      browser: { condition: service_healthy }

volumes:
  mongodb_data:
  worker_data:
